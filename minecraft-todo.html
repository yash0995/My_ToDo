<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Build Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');

  :root {
    --dirt: #8B6340;
    --grass: #5D9E3A;
    --wood: #A0722A;
    --stone: #7A7A7A;
    --gold: #FFD700;
    --sky: #6EB4D3;
    --dark: #1a1a1a;
    --panel: #2d2416;
    --panel2: #3a2e1a;
    --border: #6b4f2a;
    --text: #F5DEB3;
    --checked: #4a7c3f;
    --checked-text: #8fbc6a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(0,0,0,0.3) 31px, rgba(0,0,0,0.3) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(0,0,0,0.3) 31px, rgba(0,0,0,0.3) 32px);
    background-size: 32px 32px;
    min-height: 100vh;
    font-family: 'VT323', monospace;
    color: var(--text);
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
    padding: 20px;
    background: var(--panel);
    border: 4px solid var(--border);
    image-rendering: pixelated;
    position: relative;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05), 6px 6px 0 #000;
  }

  header::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 2px solid rgba(255,255,255,0.07);
    pointer-events: none;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4vw, 22px);
    color: var(--gold);
    text-shadow: 3px 3px 0 #7a5a00, 0 0 20px rgba(255,215,0,0.4);
    letter-spacing: 2px;
    line-height: 1.4;
  }

  .subtitle {
    font-size: 22px;
    color: #aaa;
    margin-top: 8px;
    letter-spacing: 3px;
  }

  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--panel);
    border: 3px solid var(--border);
    padding: 10px 16px;
    font-size: 20px;
    box-shadow: 3px 3px 0 #000;
    flex: 1;
    min-width: 140px;
    text-align: center;
  }

  .stat span { color: var(--gold); font-size: 24px; }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 0;
  }

  .tab {
    background: var(--panel2);
    border: 3px solid var(--border);
    border-bottom: none;
    padding: 10px 20px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #888;
    cursor: pointer;
    transition: all 0.1s;
    letter-spacing: 1px;
  }

  .tab.active {
    background: var(--panel);
    color: var(--gold);
    border-color: var(--gold);
    border-bottom: 3px solid var(--panel);
    margin-bottom: -3px;
    z-index: 1;
  }

  .tab:hover:not(.active) { color: var(--text); }

  .panel {
    background: var(--panel);
    border: 3px solid var(--border);
    padding: 16px;
    box-shadow: 6px 6px 0 #000;
  }

  .section-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--grass);
    padding: 8px 0 12px;
    letter-spacing: 2px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 10px;
  }

  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .search-bar input {
    flex: 1;
    background: #111;
    border: 3px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-family: 'VT323', monospace;
    font-size: 20px;
    outline: none;
    box-shadow: inset 2px 2px 0 #000;
  }

  .search-bar input:focus { border-color: var(--gold); }

  .btn {
    background: var(--wood);
    border: 3px solid #7a4e1a;
    border-bottom-color: #5a3010;
    border-right-color: #5a3010;
    color: #fff;
    padding: 8px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #000;
    transition: all 0.05s;
    white-space: nowrap;
  }

  .btn:active { transform: translate(2px,2px); box-shadow: none; }
  .btn.green { background: var(--checked); border-color: #2a5c20; }
  .btn.red { background: #7a2020; border-color: #4a1010; }

  .item-list { display: flex; flex-direction: column; gap: 4px; }

  .item {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 10px;
    background: #1e1812;
    border: 2px solid var(--border);
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }

  .item:hover { background: #2a2016; border-color: #9a7a4a; }

  .item.done {
    background: #0f1a0d;
    border-color: #2a4a22;
    opacity: 0.7;
  }

  .item.done .item-name { text-decoration: line-through; color: var(--checked-text); }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 3px solid var(--border);
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.5);
  }

  .item.done .checkbox { background: var(--checked); border-color: #3a6a2a; }

  .item-name {
    font-size: 20px;
    letter-spacing: 1px;
  }

  .item-info {
    text-align: right;
    white-space: nowrap;
  }

  .item-qty {
    font-size: 15px;
    color: #aaa;
  }

  .item-stacks {
    font-size: 20px;
    color: #FFD700;
    font-weight: bold;
  }

  .item-stacks .exact { color: #FFD700; }

  .progress-bar {
    height: 8px;
    background: #111;
    border: 2px solid var(--border);
    margin-bottom: 14px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--grass), #8fdf5a);
    transition: width 0.3s;
    image-rendering: pixelated;
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .legend {
    font-size: 15px;
    color: #666;
    margin-top: 10px;
    text-align: right;
  }

  .legend span { color: var(--gold); }

  @media (max-width: 600px) {
    .item { grid-template-columns: 24px 1fr auto; }
    h1 { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⛏ MINECRAFT BUILD CHECKLIST</h1>
    <div class="subtitle">MATERIALS LIST — INTERIOR &amp; EXTERIOR</div>
  </header>

  <div class="stats-bar">
    <div class="stat">TOTAL ITEMS<br><span id="total-items">0</span></div>
    <div class="stat">COLLECTED<br><span id="done-items">0</span></div>
    <div class="stat">REMAINING<br><span id="left-items">0</span></div>
    <div class="stat">PROGRESS<br><span id="pct">0%</span></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('exterior')">🌲 EXTERIOR</div>
    <div class="tab" onclick="switchTab('interior-high')">🏠 INTERIOR (HIGH)</div>
    <div class="tab" onclick="switchTab('interior-low')">🪑 INTERIOR (LOW)</div>
  </div>

  <div class="panel">
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search items..." oninput="renderAll()">
      <button class="btn green" onclick="checkAll()">CHECK ALL</button>
      <button class="btn red" onclick="uncheckAll()">RESET</button>
    </div>
    <div class="controls">
      <button class="btn" onclick="filterItems('all')">ALL</button>
      <button class="btn" onclick="filterItems('todo')">TODO</button>
      <button class="btn" onclick="filterItems('done')">DONE</button>
    </div>

    <div class="legend">QTY &nbsp;|&nbsp; <span>STACKS</span> (remainder)</div>

    <div id="tab-exterior" class="tab-content active">
      <div class="section-title">📦 EXTERIOR MATERIALS</div>
      <div class="item-list" id="list-exterior"></div>
    </div>

    <div id="tab-interior-high" class="tab-content">
      <div class="section-title">📦 INTERIOR — HIGH QUANTITY ITEMS</div>
      <div class="item-list" id="list-interior-high"></div>
    </div>

    <div id="tab-interior-low" class="tab-content">
      <div class="section-title">📦 INTERIOR — SMALL QUANTITY ITEMS</div>
      <div class="item-list" id="list-interior-low"></div>
    </div>
  </div>
</div>

<script>
const EXTERIOR = [
  {name:"Spruce Planks",qty:1657},{name:"Dark Oak Planks",qty:749},{name:"Stone Bricks",qty:737},
  {name:"Dark Oak Slab",qty:639},{name:"Spruce Trapdoors",qty:564},{name:"Stripped Oak Log",qty:428},
  {name:"Spruce Slab",qty:390},{name:"Oak Log",qty:356},{name:"Spruce Stairs",qty:248},
  {name:"Stripped Spruce Log",qty:240},{name:"Dirt",qty:238},{name:"Dead Brain Coral Block",qty:237},
  {name:"Cracked Stone Bricks",qty:214},{name:"Dark Oak Fence Gate",qty:159},{name:"Dark Oak Stairs",qty:154},
  {name:"Spruce Fence",qty:106},{name:"Polished Diorite",qty:85},{name:"Glass Pane",qty:64},
  {name:"Dark Oak Log",qty:60},{name:"Oak Sign",qty:57},{name:"Andesite",qty:47},
  {name:"Oak Trapdoors",qty:38},{name:"Dark Oak Trapdoors",qty:36},{name:"Iron Bars",qty:36},
  {name:"Ladder",qty:34},{name:"Polished Granite",qty:30},{name:"Lantern",qty:24},
  {name:"Spruce Sign",qty:24},{name:"Oak Fence Gate",qty:20},{name:"Dark Oak Fence",qty:18},
  {name:"Lectrn",qty:18},{name:"Stone Brick Wall",qty:14},{name:"Chain",qty:13},
  {name:"Flower Pot",qty:13},{name:"Spruce Fence Gate",qty:13},{name:"Polished Andesite",qty:12},
  {name:"Polished Deepslate",qty:12},{name:"Cobbled Deepslate Wall",qty:10},{name:"Torch",qty:10},
  {name:"Oak Stairs",qty:8},{name:"Spruce Leaves",qty:8},{name:"Dark Oak Sign",qty:6},
  {name:"Cobblestone Stairs",qty:5},{name:"Mossy Stone Brick Wall",qty:5},{name:"Anvil",qty:4},
  {name:"Cauldron",qty:4},{name:"Oak Slab",qty:4},{name:"Stone Pressure Plate",qty:4},
  {name:"Cobblestone",qty:3},{name:"Cobblestone Wall",qty:3},{name:"Lightning Rod",qty:2},
  {name:"Oak Doors",qty:2},{name:"Oak Wood",qty:2},{name:"Stone Brick Stairs",qty:2},
  {name:"Mossy Cobblestone Wall",qty:1},

const INTERIOR_HIGH = [
  {name:"Spruce Trapdoor",qty:497},{name:"Dark Oak Sign",qty:318},{name:"Spruce Slab",qty:181},
  {name:"Spruce Stairs",qty:175},{name:"Oak Log",qty:109},{name:"Barrel",qty:102},
  {name:"Brown Carpet",qty:92},{name:"Spruce Sign",qty:84},{name:"Oak Trapdoor",qty:84},
  {name:"Red Carpet",qty:83},{name:"Dark Oak Stairs",qty:68},{name:"Birch Leaves",qty:68},
  {name:"Chest",qty:65},{name:"Spruce Planks",qty:60},{name:"Chain",qty:54},
  {name:"Torch",qty:52},{name:"Lantern",qty:44},{name:"Candle",qty:43},
  {name:"Oak Sign",qty:42},{name:"Chiseled Bookshelf",qty:38},{name:"Flower Pot",qty:35},
  {name:"Bookshelf",qty:34},{name:"Campfire",qty:34},{name:"Item Frame",qty:34},
  {name:"Dark Oak Fence",qty:32},{name:"Composter",qty:29},{name:"Glowstone",qty:29},
  {name:"Dark Oak Slab",qty:25},{name:"Obsidian",qty:21},{name:"Dark Oak Fence Gate",qty:18},
  {name:"Spruce Fence",qty:18},{name:"Spruce Hanging Sign",qty:18},{name:"Dark Oak Trapdoor",qty:18},
  {name:"Spruce Button",qty:18},{name:"Armor Stand",qty:16},{name:"Moss Carpet",qty:16},
  {name:"Dead Brain Coral Fan",qty:16},{name:"Dark Oak Log",qty:13},{name:"P. Deepslate Stairs",qty:13},
  {name:"Green Wool",qty:12},{name:"Painting",qty:12},{name:"Lever",qty:11},
  {name:"Iron Bars",qty:10},{name:"Green Carpet",qty:10},{name:"Oak Wood",qty:9},
  {name:"Deepslate Tile Stairs",qty:9},{name:"P. Blackstone B. Stairs",qty:9},{name:"Stone Stairs",qty:8},
  {name:"Gray Banner",qty:8},{name:"Crafting Table",qty:7},{name:"Black Carpet",qty:7},
  {name:"Cobweb",qty:6},{name:"Anvil",qty:6},{name:"Scaffolding",qty:6},
  {name:"Sculk",qty:6},{name:"Large Amethyst Bud",qty:6},{name:"Decorated Pot",qty:6},
  {name:"Dark Oak Wood",qty:5},{name:"Cobbled Deepslate Wall",qty:5},{name:"Lectern",qty:5},
  {name:"Red Wool",qty:5},{name:"Green Wool (2nd)",qty:5},{name:"Bell",qty:5},
  {name:"Cobblestone Wall",qty:5},
];

const INTERIOR_LOW = [
  {name:"Grindstone",qty:5},{name:"Stonecutter",qty:4},{name:"Furnace",qty:4},
  {name:"Brewing Stand",qty:4},{name:"W. Cut Copper Stairs",qty:4},{name:"White Banner",qty:4},
  {name:"Jukebox",qty:4},{name:"Sea Pickle",qty:4},{name:"Piston",qty:3},
  {name:"Mud Brick Stairs",qty:3},{name:"Glow Item Frame",qty:3},{name:"Tripwire Hook",qty:3},
  {name:"Deepslate Tile Slab",qty:3},{name:"D. Oak Pressure Plate",qty:3},{name:"Furnace (2nd)",qty:2},
  {name:"Smoker",qty:2},{name:"Target Block",qty:2},{name:"Minecart with Chest",qty:2},
  {name:"Cake",qty:2},{name:"Spruce Fence Gate",qty:2},{name:"Green Banner",qty:2},
  {name:"Red Banner",qty:2},{name:"W. Cut Copper Slab",qty:2},{name:"Stone Slab",qty:2},
  {name:"Turtle Egg",qty:2},{name:"Lightning Rod",qty:2},{name:"Soul Torch",qty:2},
  {name:"Stone Button",qty:2},{name:"Daylight Detector",qty:2},{name:"Mangrove Trapdoor",qty:2},
  {name:"Birch Pressure Plate",qty:2},{name:"C. Deepslate Tiles",qty:1},{name:"Smithing Table",qty:1},
  {name:"Shulker Box",qty:1},{name:"Ender Chest",qty:1},{name:"Enchanting Table",qty:1},
  {name:"Grantine Wall",qty:1},{name:"Mangrove Hanging Sign",qty:1},{name:"Warped Hanging Sign",qty:1},
  {name:"Cut Copper Slab",qty:1},{name:"Smooth Stone Slab",qty:1},{name:"Polished Blackstone Brick Slab",qty:1},
  {name:"Red Bed",qty:1},{name:"Cyan Candle",qty:1},{name:"Cauldron",qty:1},
  {name:"Polished Blackstone Button",qty:1},{name:"Heavy Weighted Pressure Plate",qty:1},
];

let checked = JSON.parse(localStorage.getItem('mc-checked') || '{}');
let currentTab = 'exterior';
let filterMode = 'all';

function stacks(n) {
  const s = Math.floor(n / 64);
  const r = n % 64;
  if (s === 0) return `<span class="exact">${r} items</span>`;
  if (r === 0) return `<span class="exact">${s} stacks</span>`;
  return `<span class="exact">${s} stacks + ${r}</span>`;
}

function getList(tab) {
  if (tab === 'exterior') return EXTERIOR;
  if (tab === 'interior-high') return INTERIOR_HIGH;
  return INTERIOR_LOW;
}

function renderList(tab) {
  const list = getList(tab);
  const q = document.getElementById('search').value.toLowerCase();
  const el = document.getElementById('list-' + tab);
  const filtered = list.filter(i => {
    if (!i.name.toLowerCase().includes(q)) return false;
    const key = tab + ':' + i.name;
    if (filterMode === 'done') return !!checked[key];
    if (filterMode === 'todo') return !checked[key];
    return true;
  });

  el.innerHTML = filtered.map(item => {
    const key = tab + ':' + item.name;
    const done = !!checked[key];
    return `<div class="item${done?' done':''}" onclick="toggle('${tab}','${item.name.replace(/'/g,"\\'")}')">
      <div class="checkbox">${done?'✔':''}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-info">
        <div class="item-qty">${item.qty} items</div>
        <div class="item-stacks">${stacks(item.qty)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderAll() {
  ['exterior','interior-high','interior-low'].forEach(renderList);
  updateStats();
}

function toggle(tab, name) {
  const key = tab + ':' + name;
  checked[key] = !checked[key];
  if (!checked[key]) delete checked[key];
  localStorage.setItem('mc-checked', JSON.stringify(checked));
  renderAll();
}

function updateStats() {
  const all = [...EXTERIOR,...INTERIOR_HIGH,...INTERIOR_LOW];
  const total = all.length;
  let done = 0;
  ['exterior','interior-high','interior-low'].forEach(tab => {
    getList(tab).forEach(i => { if (checked[tab+':'+i.name]) done++; });
  });
  document.getElementById('total-items').textContent = total;
  document.getElementById('done-items').textContent = done;
  document.getElementById('left-items').textContent = total - done;
  const p = Math.round(done/total*100);
  document.getElementById('pct').textContent = p + '%';
  document.getElementById('progress').style.width = p + '%';
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    const tabs = ['exterior','interior-high','interior-low'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

function checkAll() {
  const list = getList(currentTab);
  list.forEach(i => { checked[currentTab+':'+i.name] = true; });
  localStorage.setItem('mc-checked', JSON.stringify(checked));
  renderAll();
}

function uncheckAll() {
  const list = getList(currentTab);
  list.forEach(i => { delete checked[currentTab+':'+i.name]; });
  localStorage.setItem('mc-checked', JSON.stringify(checked));
  renderAll();
}

function filterItems(mode) {
  filterMode = mode;
  renderAll();
}

renderAll();
</script>
</body>
</html>
